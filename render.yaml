services:
  - type: web
    name: nexus-simplex
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements_cloud.txt
    startCommand: python nexus_cloud.py
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: NEXUS_ENV
        value: cloud
      - key: PYTHON_VERSION
        value: "3.12"
