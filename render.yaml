services:
  - type: web
    name: nexus-core
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements_cloud.txt
    startCommand: uvicorn nexus_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NEXUS_NODE_NAME
        value: CLOUD
      - key: CLOUD_MODE
        value: "true"
