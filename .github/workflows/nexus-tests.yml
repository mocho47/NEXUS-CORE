name: NEXUS Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 10 * * *'

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install fastapi uvicorn jinja2 python-multipart groq requests httpx ezdxf reportlab numpy pygame

      - name: Setup CI config
        run: python setup_ci.py

      - name: Run test suite
        run: python nexus_test_suite.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CI: true
