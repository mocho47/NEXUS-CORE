<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NEXUS v3 - Asistente IA by Simplex">
    <title>{% block title %}NEXUS v3 by Simplex{% endblock %}</title>

    <style>
        /* ═══════════════════════════════════════════════
           NEXUS v3 — VARIABLES DE DISEÑO
           ═══════════════════════════════════════════════ */
        :root {
            --primary: #1F4E79;
            --primary-light: #2E86C1;
            --primary-dark: #163B5C;
            --accent: #2E86C1;
            --bg-dark: #1a1a2e;
            --bg-darker: #12121f;
            --bg-card: #16213e;
            --bg-card-hover: #1a2847;
            --bg-input: #0f1527;
            --border: #2a2a4a;
            --border-light: #3a3a5a;
            --text: #e0e0e0;
            --text-light: #a0a0a0;
            --text-muted: #6a6a8a;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --info: #2E86C1;
            --white: #ffffff;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-lg: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
        }

        /* ═══════════════════════════════════════════════
           RESET Y BASE
           ═══════════════════════════════════════════════ */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background-color: var(--bg-dark);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ═══════════════════════════════════════════════
           SCROLLBAR PERSONALIZADO
           ═══════════════════════════════════════════════ */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-darker);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-light);
        }

        /* Firefox */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--border) var(--bg-darker);
        }

        /* ═══════════════════════════════════════════════
           ANIMACIONES
           ═══════════════════════════════════════════════ */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.5; }
        }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40%           { transform: translateY(-6px); }
        }
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 5px rgba(46, 134, 193, 0.3); }
            50%      { box-shadow: 0 0 20px rgba(46, 134, 193, 0.6); }
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(100%) scale(0.9); }
            to   { opacity: 1; transform: translateX(0) scale(1); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateX(0) scale(1); }
            to   { opacity: 0; transform: translateX(100%) scale(0.9); }
        }

        .fade-in       { animation: fadeIn 0.4s ease-out; }
        .fade-in-up    { animation: fadeInUp 0.5s ease-out; }
        .slide-in-right { animation: slideInRight 0.4s ease-out; }
        .slide-in-left  { animation: slideInLeft 0.4s ease-out; }

        /* ═══════════════════════════════════════════════
           HEADER / NAVEGACIÓN
           ═══════════════════════════════════════════════ */
        .navbar {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            user-select: none;
        }

        .navbar-logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 14px;
            color: var(--white);
            letter-spacing: 1px;
            box-shadow: 0 2px 12px rgba(31, 78, 121, 0.4);
        }

        .navbar-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.5px;
        }

        .navbar-title span {
            color: var(--accent);
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* ── Selector de Personalidad ── */
        .personality-select {
            position: relative;
        }

        .personality-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: var(--font);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .personality-btn:hover {
            border-color: var(--accent);
            background: var(--bg-card);
        }

        .personality-btn .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
        }

        .personality-btn .arrow {
            font-size: 0.7rem;
            opacity: 0.5;
            transition: var(--transition);
        }

        .personality-btn.active .arrow {
            transform: rotate(180deg);
        }

        .personality-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            min-width: 180px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            padding: 6px;
            z-index: 1100;
            display: none;
            animation: fadeIn 0.2s ease-out;
        }

        .personality-dropdown.show {
            display: block;
        }

        .personality-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.85rem;
            color: var(--text);
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: var(--font);
        }

        .personality-option:hover {
            background: var(--bg-card-hover);
        }

        .personality-option.selected {
            background: rgba(46, 134, 193, 0.15);
            color: var(--accent);
        }

        .personality-option .icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .personality-option .icon.nexus  { background: linear-gradient(135deg, #1F4E79, #2E86C1); color: #fff; }
        .personality-option .icon.forja  { background: linear-gradient(135deg, #e67e22, #f39c12); color: #fff; }
        .personality-option .icon.teens  { background: linear-gradient(135deg, #8e44ad, #bb6bd9); color: #fff; }

        /* ── Indicadores de Motor ── */
        .motor-indicators {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .motor-dot {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .motor-dot .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            transition: var(--transition);
        }

        .motor-dot .dot.ok   { background: var(--success); box-shadow: 0 0 6px rgba(39, 174, 96, 0.5); }
        .motor-dot .dot.err  { background: var(--danger);  box-shadow: 0 0 6px rgba(231, 76, 60, 0.5); }
        .motor-dot .dot.warn { background: var(--warning); box-shadow: 0 0 6px rgba(243, 156, 18, 0.5); }
        .motor-dot .dot.off  { background: var(--text-muted); }

        @media (max-width: 768px) {
            .motor-indicators { display: none; }
        }

        /* ═══════════════════════════════════════════════
           CONTENIDO PRINCIPAL
           ═══════════════════════════════════════════════ */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ═══════════════════════════════════════════════
           FOOTER
           ═══════════════════════════════════════════════ */
        .footer {
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            padding: 12px 24px;
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }

        .footer span {
            color: var(--accent);
            font-weight: 600;
        }

        .footer .sep {
            margin: 0 8px;
            opacity: 0.3;
        }

        .footer .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(39, 174, 96, 0.15);
            color: var(--success);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 8px;
        }

        .footer .badge .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--success);
        }

        /* ═══════════════════════════════════════════════
           TOAST NOTIFICATIONS
           ═══════════════════════════════════════════════ */
        .toast-container {
            position: fixed;
            top: 72px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            font-size: 0.85rem;
            color: var(--text);
            min-width: 280px;
            max-width: 400px;
            animation: toastIn 0.35s ease-out;
            pointer-events: auto;
            backdrop-filter: blur(8px);
        }

        .toast.removing {
            animation: toastOut 0.3s ease-in forwards;
        }

        .toast.success { border-left: 4px solid var(--success); }
        .toast.error   { border-left: 4px solid var(--danger); }
        .toast.info    { border-left: 4px solid var(--info); }
        .toast.warning { border-left: 4px solid var(--warning); }

        .toast .toast-icon {
            font-size: 1rem;
            flex-shrink: 0;
        }

        .toast.success .toast-icon { color: var(--success); }
        .toast.error .toast-icon   { color: var(--danger); }
        .toast.info .toast-icon    { color: var(--info); }
        .toast.warning .toast-icon { color: var(--warning); }

        .toast .toast-close {
            margin-left: auto;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 0;
            line-height: 1;
            transition: var(--transition);
        }

        .toast .toast-close:hover {
            color: var(--text);
        }

        /* ═══════════════════════════════════════════════
           BOTONES BASE
           ═══════════════════════════════════════════════ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: var(--font);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            white-space: nowrap;
            user-select: none;
        }

        .btn:active { transform: scale(0.97); }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: var(--white);
            box-shadow: 0 2px 12px rgba(31, 78, 121, 0.3);
        }
        .btn-primary:hover {
            box-shadow: 0 4px 20px rgba(31, 78, 121, 0.5);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            border-color: var(--accent);
            background: var(--bg-card-hover);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-light);
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }

        .btn-danger {
            background: var(--danger);
            color: var(--white);
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 0.8rem;
        }

        .btn-icon {
            width: 38px;
            height: 38px;
            padding: 0;
            border-radius: 50%;
        }

        /* ═══════════════════════════════════════════════
           MODALES
           ═══════════════════════════════════════════════ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 5000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 520px;
            max-height: 85vh;
            overflow-y: auto;
            transform: scale(0.95) translateY(10px);
            transition: var(--transition);
        }

        .modal-overlay.show .modal {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: var(--transition);
        }

        .modal-close:hover {
            background: rgba(231, 76, 60, 0.15);
            color: var(--danger);
        }

        .modal-body {
            padding: 24px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 16px 24px;
            border-top: 1px solid var(--border);
        }

        /* ═══════════════════════════════════════════════
           UTILIDADES
           ═══════════════════════════════════════════════ */
        .hidden   { display: none !important; }
        .flex     { display: flex; }
        .gap-8    { gap: 8px; }
        .gap-12   { gap: 12px; }
        .gap-16   { gap: 16px; }
        .items-center { align-items: center; }
        .text-sm  { font-size: 0.8rem; }
        .text-xs  { font-size: 0.7rem; }
        .text-muted { color: var(--text-muted); }
        .text-light { color: var(--text-light); }
        .font-mono { font-family: var(--font-mono); }

        /* ═══════════════════════════════════════════════
           RESPONSIVE
           ═══════════════════════════════════════════════ */
        @media (max-width: 768px) {
            .navbar {
                padding: 0 16px;
                height: 56px;
            }
            .navbar-title {
                font-size: 1rem;
            }
            .footer {
                padding: 10px 16px;
                font-size: 0.72rem;
            }
        }

        @media (max-width: 480px) {
            .toast {
                min-width: 240px;
                max-width: calc(100vw - 40px);
                font-size: 0.8rem;
            }
            .toast-container {
                right: 10px;
                left: 10px;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- ═══════ BARRA DE NAVEGACIÓN ═══════ -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <div class="navbar-logo">N3</div>
            <div class="navbar-title"><span>NEXUS</span> by Simplex</div>
        </a>

        <div class="navbar-actions">
            <!-- Selector de Personalidad -->
            <div class="personality-select" id="personalitySelect">
                <button class="personality-btn" id="personalityBtn" onclick="togglePersonalityDropdown()">
                    <span class="dot" id="personalityDot"></span>
                    <span id="personalityLabel">NEXUS</span>
                    <span class="arrow">&#9662;</span>
                </button>
                <div class="personality-dropdown" id="personalityDropdown">
                    <button class="personality-option selected" data-personality="nexus" onclick="switchPersonality('nexus')">
                        <span class="icon nexus">N</span>
                        <div>
                            <div style="font-weight:600;">NEXUS</div>
                            <div style="font-size:0.7rem;color:var(--text-muted);">Asistente integral</div>
                        </div>
                    </button>
                    <button class="personality-option" data-personality="forja" onclick="switchPersonality('forja')">
                        <span class="icon forja">F</span>
                        <div>
                            <div style="font-weight:600;">FORJA</div>
                            <div style="font-size:0.7rem;color:var(--text-muted);">Coach empresarial</div>
                        </div>
                    </button>
                    <button class="personality-option" data-personality="teens" onclick="switchPersonality('teens')">
                        <span class="icon teens">T</span>
                        <div>
                            <div style="font-weight:600;">TEENS</div>
                            <div style="font-size:0.7rem;color:var(--text-muted);">Educador juvenil</div>
                        </div>
                    </button>
                </div>
            </div>

            <!-- Indicadores de Motores -->
            <div class="motor-indicators" id="motorIndicators">
                <div class="motor-dot" title="Motor de Negocios">
                    <span class="dot ok" data-motor="negocios"></span>
                </div>
                <div class="motor-dot" title="Motor de Archivos">
                    <span class="dot ok" data-motor="archivos"></span>
                </div>
                <div class="motor-dot" title="Motor de Diseño">
                    <span class="dot ok" data-motor="diseno"></span>
                </div>
                <div class="motor-dot" title="Motor Social">
                    <span class="dot ok" data-motor="social"></span>
                </div>
            </div>
        </div>
    </nav>

    <!-- ═══════ CONTENIDO PRINCIPAL ═══════ -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- ═══════ PIE DE PÁGINA ═══════ -->
    <footer class="footer">
        <span>NEXUS</span> v3 by Simplex
        <span class="sep">|</span> v3.0
        <span class="sep">|</span> Local & Privado
        <span class="badge"><span class="dot"></span> Sistema Activo</span>
    </footer>

    <!-- ═══════ CONTENEDOR DE TOASTS ═══════ -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ═══════ JAVASCRIPT BASE ═══════ -->
    <script>
        // ═══════════════════════════════════════════════
        // CONFIGURACIÓN GLOBAL
        // ═══════════════════════════════════════════════
        const NEXUS_CONFIG = {
            API_BASE: 'http://localhost:8003',
            PERSONALITY: 'nexus',
            SESSION_ID: null,
            CHECK_INTERVAL: 30000,  // 30 segundos
        };

        // ═══════════════════════════════════════════════
        // API HELPER — Hace llamadas al backend
        // ═══════════════════════════════════════════════
        async function apiCall(endpoint, method = 'GET', body = null) {
            const url = endpoint.startsWith('http') ? endpoint : `${NEXUS_CONFIG.API_BASE}${endpoint}`;
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    'X-Personality': NEXUS_CONFIG.PERSONALITY,
                },
            };
            if (NEXUS_CONFIG.SESSION_ID) {
                options.headers['X-Session-ID'] = NEXUS_CONFIG.SESSION_ID;
            }
            if (body && method !== 'GET') {
                options.body = JSON.stringify(body);
            }

            try {
                const response = await fetch(url, options);
                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.detail || `Error ${response.status}: ${response.statusText}`);
                }
                if (response.status === 204) return null;
                return await response.json();
            } catch (error) {
                console.error(`[API] ${method} ${endpoint} falló:`, error.message);
                throw error;
            }
        }

        // ═══════════════════════════════════════════════
        // SELECTOR DE PERSONALIDAD
        // ═══════════════════════════════════════════════
        function togglePersonalityDropdown() {
            const dropdown = document.getElementById('personalityDropdown');
            const btn = document.getElementById('personalityBtn');
            dropdown.classList.toggle('show');
            btn.classList.toggle('active');
        }

        // Cerrar dropdown al hacer clic fuera
        document.addEventListener('click', (e) => {
            const select = document.getElementById('personalitySelect');
            if (select && !select.contains(e.target)) {
                const dropdown = document.getElementById('personalityDropdown');
                const btn = document.getElementById('personalityBtn');
                if (dropdown) dropdown.classList.remove('show');
                if (btn) btn.classList.remove('active');
            }
        });

        async function switchPersonality(personality) {
            const colors = { nexus: '#2E86C1', forja: '#f39c12', teens: '#bb6bd9' };
            NEXUS_CONFIG.PERSONALITY = personality;

            // Actualizar UI
            document.getElementById('personalityLabel').textContent = personality.toUpperCase();
            document.getElementById('personalityDot').style.background = colors[personality] || colors.nexus;

            // Actualizar opción seleccionada
            document.querySelectorAll('.personality-option').forEach(opt => {
                opt.classList.toggle('selected', opt.dataset.personality === personality);
            });

            // Cerrar dropdown
            document.getElementById('personalityDropdown').classList.remove('show');
            document.getElementById('personalityBtn').classList.remove('active');

            // Notificar al backend
            try {
                await apiCall('/api/personality', 'POST', { personality });
                showToast(`Personalidad cambiada a ${personality.toUpperCase()}`, 'success');
            } catch (err) {
                showToast(`Error al cambiar personalidad: ${err.message}`, 'error');
            }

            // Disparar evento personal para que las vistas reaccionen
            window.dispatchEvent(new CustomEvent('personalityChanged', { detail: { personality } }));
        }

        // ═══════════════════════════════════════════════
        // VERIFICADOR DE ESTADO DE MOTORES
        // ═══════════════════════════════════════════════
        async function checkMotorStatus() {
            try {
                const data = await apiCall('/api/status');
                if (data && data.motors) {
                    for (const [motor, status] of Object.entries(data.motors)) {
                        const dot = document.querySelector(`.motor-dot .dot[data-motor="${motor}"]`);
                        if (dot) {
                            dot.className = 'dot';
                            if (status === 'ok' || status === true) {
                                dot.classList.add('ok');
                            } else if (status === 'error' || status === false) {
                                dot.classList.add('err');
                            } else if (status === 'warning') {
                                dot.classList.add('warn');
                            } else {
                                dot.classList.add('off');
                            }
                        }
                    }
                }
                // Actualizar providers de IA si vienen
                if (data && data.providers) {
                    window.dispatchEvent(new CustomEvent('providersUpdated', { detail: data.providers }));
                }
            } catch (err) {
                // Silencioso — no spamear errores de status
                console.warn('[Status] No se pudo verificar motores:', err.message);
            }
        }

        // Verificar cada 30 segundos
        setInterval(checkMotorStatus, NEXUS_CONFIG.CHECK_INTERVAL);
        // Verificar al cargar
        setTimeout(checkMotorStatus, 1000);

        // ═══════════════════════════════════════════════
        // SISTEMA DE NOTIFICACIONES TOAST
        // ═══════════════════════════════════════════════
        function showToast(message, type = 'info', duration = 4000) {
            const container = document.getElementById('toastContainer');
            const icons = {
                success: '&#10003;',
                error:   '&#10007;',
                info:    '&#8505;',
                warning: '&#9888;',
            };

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span class="toast-icon">${icons[type] || icons.info}</span>
                <span>${message}</span>
                <button class="toast-close" onclick="dismissToast(this.parentElement)">&times;</button>
            `;

            container.appendChild(toast);

            // Auto-remover
            if (duration > 0) {
                setTimeout(() => dismissToast(toast), duration);
            }
        }

        function dismissToast(toastEl) {
            if (!toastEl || toastEl.classList.contains('removing')) return;
            toastEl.classList.add('removing');
            setTimeout(() => toastEl.remove(), 300);
        }

        // ═══════════════════════════════════════════════
        // UTILIDADES GLOBALES
        // ═══════════════════════════════════════════════
        function formatTime(date) {
            return new Intl.DateTimeFormat('es-ES', {
                hour: '2-digit',
                minute: '2-digit'
            }).format(date);
        }

        function generateId() {
            return 'id_' + Math.random().toString(36).substr(2, 9);
        }

        // Escape HTML para prevenir XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ═══════════════════════════════════════════════
        // INICIALIZACIÓN
        // ═══════════════════════════════════════════════
        console.log('%c NEXUS v3 by Simplex ', 'background:#1F4E79;color:#fff;padding:4px 12px;border-radius:4px;font-weight:bold;');
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
