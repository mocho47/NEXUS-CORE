<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte - NEXUS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0a0a; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; padding: 16px; }
        h2 { color: #00ff88; margin-bottom: 16px; }
        .nav a { color: #888; text-decoration: none; font-size: 0.9em; }
        .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .kpi { background: #111; border: 1px solid #1e1e1e; border-radius: 10px; padding: 16px; text-align: center; }
        .kpi .num { font-size: 2.2em; font-weight: bold; color: #00ff88; }
        .kpi .lbl { font-size: 0.75em; color: #555; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
        .kpi.alerta .num { color: #ff4444; }
        .kpi.warn   .num { color: #ffaa00; }
        .section { background: #111; border: 1px solid #1e1e1e; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
        .section h3 { color: #00ff88; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; border-bottom: 1px solid #1e1e1e; padding-bottom: 8px; }
        .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #0f0f0f; font-size: 0.88em; }
        .row:last-child { border-bottom: none; }
        .badge { padding: 2px 8px; border-radius: 4px; font-size: 0.75em; font-weight: bold; }
        .badge-pen  { background: #ffaa0022; color: #ffaa00; }
        .badge-ok   { background: #00ff8822; color: #00ff88; }
        .badge-warn { background: #ff440022; color: #ff4444; }
        .bar-wrap { background: #0f0f0f; border-radius: 4px; height: 8px; flex: 1; margin: 0 12px; }
        .bar { background: #00ff88; border-radius: 4px; height: 8px; transition: width 0.5s; }
        .bar.warn { background: #ff4444; }
        .timestamp { color: #333; font-size: 0.75em; margin-top: 8px; text-align: right; }
        .btn-refresh { background: #00ff8822; border: 1px solid #00ff8844; color: #00ff88; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85em; margin-bottom: 16px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div class="nav" style="margin-bottom:14px;"><a href="/dashboard">← Dashboard</a></div>
    <h2>📊 Reporte del Negocio</h2>
    <button class="btn-refresh" onclick="cargarReporte()">↻ Actualizar</button>

    <!-- KPIs principales -->
    <div class="grid-4" id="kpis">
        <div class="kpi"><div class="num" id="k-pendientes">—</div><div class="lbl">Pendientes</div></div>
        <div class="kpi"><div class="num" id="k-hoy">—</div><div class="lbl">Vencen hoy</div></div>
        <div class="kpi"><div class="num" id="k-clientes">—</div><div class="lbl">Clientes</div></div>
        <div class="kpi"><div class="num" id="k-stock">—</div><div class="lbl">Items stock</div></div>
    </div>

    <!-- Sistema -->
    <div class="section">
        <div class="section-header">
            <h3>⚙️ Sistema</h3>
            <span id="nexus-status" style="color:#00ff88;font-size:0.8em;">ONLINE</span>
        </div>
        <div class="row">
            <span>CPU</span>
            <div class="bar-wrap"><div class="bar" id="bar-cpu" style="width:0%"></div></div>
            <span id="val-cpu" style="min-width:36px;text-align:right">—</span>
        </div>
        <div class="row">
            <span>RAM</span>
            <div class="bar-wrap"><div class="bar" id="bar-ram" style="width:0%"></div></div>
            <span id="val-ram" style="min-width:36px;text-align:right">—</span>
        </div>
        <div class="row">
            <span>Versión</span>
            <span id="val-version" style="color:#555">—</span>
        </div>
    </div>

    <!-- Pedidos pendientes -->
    <div class="section">
        <h3>📋 Pedidos por vencer</h3>
        <div id="lista-pedidos"><span style="color:#333">Cargando...</span></div>
    </div>

    <!-- Stock bajo -->
    <div class="section">
        <h3>⚠️ Stock bajo</h3>
        <div id="lista-stock"><span style="color:#333">Cargando...</span></div>
    </div>

    <!-- Módulos -->
    <div class="section">
        <h3>🔧 Módulos activos</h3>
        <div id="lista-modulos" style="display:flex;flex-wrap:wrap;gap:6px;">
            <span style="color:#333">Cargando...</span>
        </div>
    </div>

    <div class="timestamp" id="ts">—</div>

    <script>
    async function cargarReporte() {
        try {
            // Resumen de negocio
            const r = await fetch('/api/resumen');
            const d = await r.json();
            document.getElementById('k-pendientes').innerText = d.pedidos_pendientes ?? '—';
            document.getElementById('k-hoy').innerText        = d.pedidos_hoy ?? '—';
            document.getElementById('k-clientes').innerText   = d.total_clientes ?? '—';
            document.getElementById('k-stock').innerText      = d.items_stock ?? '—';

            // Pedidos
            const pedidos = d.detalle_hoy || [];
            const listaPed = document.getElementById('lista-pedidos');
            if (pedidos.length === 0) {
                listaPed.innerHTML = '<span style="color:#333">Sin pedidos urgentes hoy</span>';
            } else {
                listaPed.innerHTML = pedidos.map(p => `
                    <div class="row">
                        <span style="font-weight:bold">${p.cliente}</span>
                        <span style="color:#888;font-size:0.85em">${p.producto}</span>
                        <span class="badge badge-pen">${(p.deadline||'').slice(11,16)}</span>
                    </div>`).join('');
            }

            // Stock bajo
            const bajo = d.bajo_stock || [];
            const listaStk = document.getElementById('lista-stock');
            if (bajo.length === 0) {
                listaStk.innerHTML = '<span style="color:#00ff88;font-size:0.85em">✓ Todo el stock está bien</span>';
            } else {
                listaStk.innerHTML = bajo.map(i => `
                    <div class="row">
                        <span>${i.nombre}</span>
                        <span class="badge badge-warn">${i.cantidad} uds</span>
                    </div>`).join('');
            }
        } catch(e) {
            console.error('Error resumen:', e);
        }

        try {
            // Estado del sistema
            const s = await fetch('/api/nexus_status');
            const sd = await s.json();
            document.getElementById('val-version').innerText = sd.version || '—';

            // Módulos
            const mods = sd.modules || [];
            document.getElementById('lista-modulos').innerHTML = mods.map(m =>
                `<span style="padding:3px 10px;border-radius:20px;font-size:0.78em;
                    background:${m.ok?'#00ff8822':'#ff444422'};
                    color:${m.ok?'#00ff88':'#ff4444'}">${m.nombre} ${m.ok?'✓':'✗'}</span>`
            ).join('');
        } catch(e) {}

        try {
            // CPU / RAM desde psutil vía endpoint
            const p = await fetch('/api/system');
            if (p.ok) {
                const pd = await p.json();
                const cpu = pd.cpu || 0;
                const ram = pd.ram || 0;
                document.getElementById('val-cpu').innerText = cpu.toFixed(0) + '%';
                document.getElementById('val-ram').innerText = ram.toFixed(0) + '%';
                document.getElementById('bar-cpu').style.width = cpu + '%';
                document.getElementById('bar-ram').style.width = ram + '%';
                document.getElementById('bar-cpu').className = 'bar' + (cpu > 80 ? ' warn' : '');
                document.getElementById('bar-ram').className = 'bar' + (ram > 85 ? ' warn' : '');
            }
        } catch(e) {}

        document.getElementById('ts').innerText = 'Actualizado: ' + new Date().toLocaleTimeString('es-MX');
    }

    cargarReporte();
    setInterval(cargarReporte, 30000);
    </script>
</body>
</html>
