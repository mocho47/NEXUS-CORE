<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Cliente - NEXUS</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #0a0a0a; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; padding: 20px; max-width: 520px; margin: 0 auto; }
        h2 { color: #00ff88; margin-bottom: 24px; }
        .nav a { color: #888; text-decoration: none; font-size: 0.9em; }
        .form-card { background: #141414; border: 1px solid #222; border-radius: 10px; padding: 24px; }
        .field { margin-bottom: 16px; }
        label { display: block; color: #888; font-size: 0.8em; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.05em; }
        input, textarea {
            width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff;
            padding: 10px 14px; border-radius: 6px; font-size: 0.95em; font-family: inherit;
        }
        input:focus, textarea:focus { outline: none; border-color: #00ff88; }
        textarea { resize: vertical; min-height: 80px; }
        .hint { color: #555; font-size: 0.78em; margin-top: 4px; }
        .btn-submit {
            width: 100%; background: #00ff8822; border: 1px solid #00ff88; color: #00ff88;
            padding: 11px; border-radius: 6px; cursor: pointer; font-size: 1em; margin-top: 8px;
        }
        .btn-submit:hover { background: #00ff8844; }
        .toast { display: none; position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #00ff8820; border: 1px solid #00ff88; color: #00ff88;
            padding: 10px 24px; border-radius: 8px; font-size: 0.9em; }
        .toast.show { display: block; }
    </style>
</head>
<body>
    <div class="nav" style="margin-bottom:20px;"><a href="/clientes">← Clientes</a></div>
    <h2>👤 Nuevo Cliente</h2>

    <div class="form-card">
        <form method="post" action="/nuevo_cliente" onsubmit="showToast()">
            <div class="field">
                <label>Nombre completo *</label>
                <input name="nombre" placeholder="Ej. María García" required autofocus>
            </div>
            <div class="field">
                <label>Teléfono *</label>
                <input name="telefono" type="tel" placeholder="Ej. 8121234567" required maxlength="15">
                <div class="hint">10 dígitos sin espacios ni guiones</div>
            </div>
            <div class="field">
                <label>Email</label>
                <input name="email" type="email" placeholder="Ej. cliente@correo.com">
            </div>
            <div class="field">
                <label>Notas</label>
                <textarea name="notas" placeholder="Preferencias, referencias, notas..."></textarea>
            </div>
            <button class="btn-submit" type="submit">✓ Guardar Cliente</button>
        </form>
    </div>

    <div class="toast" id="toast">✓ Cliente guardado</div>

    <script>
    function showToast() {
        document.getElementById('toast').classList.add('show');
    }
    // Mostrar toast si viene de redirección exitosa
    if (window.location.search.includes('ok=1')) {
        const t = document.getElementById('toast');
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }
    </script>
</body>
</html>
