<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>NEXUS — Asistente de Voz</title>
<style>
:root{
  --bg:#000;--surface:#0d0d0d;--surface2:#1a1a1a;--border:#222;
  --green:#00ff88;--blue:#00aaff;--gold:#ffd700;--red:#ff4444;
  --muted:#444;--text:#f0f0f0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--text);font-family:-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column}

/* ── HEADER ── */
.hdr{padding:14px 20px;display:flex;align-items:center;gap:12px;position:relative;z-index:10}
.hdr-logo{font-size:13px;font-weight:700;color:var(--green);letter-spacing:2px}
.hdr-sub{font-size:11px;color:var(--muted)}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill-btn{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;transition:.2s}
.pill-btn:hover,.pill-btn.active{border-color:var(--green);color:var(--green)}
.back-link{font-size:11px;color:var(--muted);text-decoration:none;padding:5px 10px;border:1px solid var(--border);border-radius:20px}
.back-link:hover{border-color:var(--green);color:var(--green)}

/* ── MAIN STAGE ── */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}

/* Fondo de olas animadas */
.stage-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.wave{position:absolute;border-radius:50%;border:1px solid;opacity:0;transform:scale(0)}
.wave.w1{width:300px;height:300px;top:50%;left:50%;margin:-150px 0 0 -150px;border-color:rgba(0,255,136,.15)}
.wave.w2{width:450px;height:450px;top:50%;left:50%;margin:-225px 0 0 -225px;border-color:rgba(0,255,136,.1)}
.wave.w3{width:620px;height:620px;top:50%;left:50%;margin:-310px 0 0 -310px;border-color:rgba(0,255,136,.06)}

/* Estado escuchando — olas activas */
body.listening .wave{animation:waveOut 2s ease-out infinite}
body.listening .wave.w2{animation-delay:.4s}
body.listening .wave.w3{animation-delay:.8s}
@keyframes waveOut{0%{opacity:.8;transform:scale(.2)}100%{opacity:0;transform:scale(1)}}

body.processing .wave{animation:wavePulse 1s ease-in-out infinite}
@keyframes wavePulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:.6;transform:scale(.95)}}

/* ── ORB ── */
.orb-wrap{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:32px;cursor:pointer}
.orb{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:44px;position:relative;transition:.4s;
  background:radial-gradient(circle at 35% 35%, #1a1a1a, #000);
  border:2px solid #222;
  box-shadow:0 0 0 0 rgba(0,255,136,0)}
.orb::before{content:'';position:absolute;inset:-3px;border-radius:50%;
  background:conic-gradient(var(--green), var(--blue), var(--green));
  z-index:-1;opacity:0;transition:.4s;filter:blur(6px)}

body.listening .orb{
  border-color:var(--green);
  box-shadow:0 0 40px rgba(0,255,136,.4), 0 0 80px rgba(0,255,136,.15);
}
body.listening .orb::before{opacity:.6;animation:spin 3s linear infinite}
body.processing .orb{
  border-color:var(--gold);
  box-shadow:0 0 40px rgba(255,215,0,.4);
}
body.processing .orb::before{opacity:.5;border-radius:50%;background:conic-gradient(var(--gold),var(--blue),var(--gold));animation:spin 1.5s linear infinite}
body.speaking .orb{
  border-color:var(--blue);
  box-shadow:0 0 40px rgba(0,170,255,.4);
}
body.speaking .orb::before{opacity:.5;background:conic-gradient(var(--blue),var(--green),var(--blue));animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── STATUS LABEL ── */
.status-label{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;transition:.3s;min-height:20px}
body.listening  .status-label{color:var(--green)}
body.processing .status-label{color:var(--gold)}
body.speaking   .status-label{color:var(--blue)}

/* ── TRANSCRIPCIÓN EN VIVO ── */
.live-text{font-size:15px;color:rgba(255,255,255,.6);font-style:italic;min-height:24px;max-width:380px;text-align:center;line-height:1.4;transition:.2s}
body.listening .live-text{color:rgba(0,255,136,.7)}

/* ── WAKE WORD HINT ── */
.wake-hint{font-size:11px;color:var(--muted);margin-top:10px;text-align:center}
.wake-hint span{color:var(--green);font-weight:700}

/* ── BUBBLE DE RESPUESTA ── */
.response-bubble{
  max-width:500px;width:calc(100% - 40px);
  background:var(--surface);border:1px solid #00ff8822;
  border-radius:16px;padding:16px 20px;
  font-size:14px;line-height:1.6;color:var(--text);
  margin-top:24px;
  display:none;animation:fadeUp .3s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.response-bubble.show{display:block}
.response-from{font-size:10px;color:var(--green);font-weight:700;letter-spacing:1px;margin-bottom:6px}

/* ── HISTORIAL COLAPSADO ── */
.history-toggle{font-size:11px;color:var(--muted);cursor:pointer;margin-top:10px;text-align:center}
.history-toggle:hover{color:var(--green)}

/* ── BOTTOM BAR ── */
.bottom-bar{padding:16px 20px 24px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(transparent,#000 60%)}
.input-row{display:flex;gap:10px;align-items:center}
#cmdInput{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:12px 18px;border-radius:28px;font-size:14px;outline:none}
#cmdInput:focus{border-color:var(--green)}
.btn-mic-big{width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;transition:.3s;
  background:var(--surface2);border:2px solid var(--border);color:var(--muted);flex-shrink:0}
.btn-mic-big.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 20px rgba(255,68,68,.5)}
.btn-send{width:46px;height:46px;border-radius:50%;border:none;background:var(--green);color:#000;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}

/* QUICK */
.quick-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.quick-row::-webkit-scrollbar{display:none}
.qcmd{background:var(--surface2);border:1px solid var(--border);color:var(--muted);font-size:12px;padding:5px 14px;border-radius:16px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.qcmd:hover{border-color:var(--green);color:var(--green)}

/* MODO BADGE */
.mode-badge{position:absolute;top:16px;right:16px;font-size:10px;padding:3px 10px;border-radius:10px;font-weight:700;letter-spacing:1px}
.mode-badge.continuo{background:rgba(0,255,136,.15);color:var(--green);border:1px solid #00ff8833}
.mode-badge.manual{background:rgba(100,100,100,.15);color:var(--muted);border:1px solid #33333366}
</style>
</head>
<body id="body">

<!-- HEADER -->
<div class="hdr">
  <div>
    <div class="hdr-logo">NEXUS</div>
    <div class="hdr-sub">Asistente de voz</div>
  </div>
  <div class="hdr-right">
    <button class="pill-btn active" id="btnContinuo" onclick="toggleModo()">🔁 Continuo</button>
    <a href="/dashboard" class="back-link">← Panel</a>
  </div>
</div>

<!-- STAGE PRINCIPAL -->
<div class="stage">
  <div class="stage-bg">
    <div class="wave w1"></div>
    <div class="wave w2"></div>
    <div class="wave w3"></div>
  </div>

  <div class="mode-badge continuo" id="modeBadge">CONTINUO</div>

  <!-- ORB -->
  <div class="orb-wrap" onclick="toggleMic()">
    <div class="orb" id="orb">🎙️</div>
  </div>

  <div class="status-label" id="statusLabel">Toca para hablar</div>
  <div class="live-text" id="liveText">— di "nexus" para activar —</div>
  <div class="wake-hint" id="wakeHint">Modo continuo: escucho siempre · detecta la palabra <span>nexus</span></div>

  <!-- RESPUESTA -->
  <div class="response-bubble" id="responseBubble">
    <div class="response-from">NEXUS dice</div>
    <div id="responseText"></div>
  </div>
</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <div class="quick-row">
    <div class="qcmd" onclick="enviar('cuántos pedidos tengo hoy')">📦 Pedidos</div>
    <div class="qcmd" onclick="enviar('cómo está el stock')">🏪 Stock</div>
    <div class="qcmd" onclick="enviar('cuántos clientes tenemos')">👥 Clientes</div>
    <div class="qcmd" onclick="enviar('genera un post para instagram de ATF')">📣 Post</div>
    <div class="qcmd" onclick="enviar('cuáles son mis ventas de hoy')">💰 Ventas</div>
    <div class="qcmd" onclick="enviar('cuéntame un chiste')">😄 Chiste</div>
  </div>
  <div class="input-row">
    <button class="btn-mic-big" id="btnMic" onclick="toggleMic()">🎙️</button>
    <input id="cmdInput" type="text" placeholder="O escribe aquí..."
      onkeydown="if(event.key==='Enter'){enviar(this.value);this.value=''}">
    <button class="btn-send" onclick="enviarInput()">↑</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════
// ESTADO
// ══════════════════════════════════════════════════════════
const body      = document.getElementById('body');
const orb       = document.getElementById('orb');
const liveText  = document.getElementById('liveText');
const statusLbl = document.getElementById('statusLabel');
const respBub   = document.getElementById('responseBubble');
const respTxt   = document.getElementById('responseText');
const btnMic    = document.getElementById('btnMic');

let recognition = null;
let micActivo   = false;
let modoContinuo = true;
let esperandoCmd = false;   // true cuando detectó "nexus" y espera el comando
let bufferCmd    = '';
let sessionId    = 'ear_' + Date.now();
let synth        = window.speechSynthesis;
let vozCargada   = null;

const WAKE_WORDS = ['nexus','nexos','nexis','néctar','nexux'];

// ══════════════════════════════════════════════════════════
// MODO CONTINUO / MANUAL
// ══════════════════════════════════════════════════════════
function toggleModo() {
  modoContinuo = !modoContinuo;
  const btn   = document.getElementById('btnContinuo');
  const badge = document.getElementById('modeBadge');
  const hint  = document.getElementById('wakeHint');
  if (modoContinuo) {
    btn.textContent = '🔁 Continuo';
    btn.classList.add('active');
    badge.textContent = 'CONTINUO';
    badge.className = 'mode-badge continuo';
    hint.innerHTML = 'Modo continuo: escucho siempre · detecta la palabra <span>nexus</span>';
  } else {
    btn.textContent = '👆 Manual';
    btn.classList.remove('active');
    badge.textContent = 'MANUAL';
    badge.className = 'mode-badge manual';
    hint.textContent = 'Toca el orbe o el botón para hablar';
    if (micActivo) toggleMic();
  }
}

// ══════════════════════════════════════════════════════════
// SPEECH RECOGNITION
// ══════════════════════════════════════════════════════════
function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { setEstado('error'); liveText.textContent = '⚠️ Usa Chrome para voz'; return null; }

  const r = new SR();
  r.lang           = 'es-MX';
  r.continuous     = true;
  r.interimResults = true;

  r.onstart = () => {
    setEstado('listening');
    btnMic.classList.add('on');
    btnMic.textContent = '🔴';
    orb.textContent = '🎙️';
  };

  r.onend = () => {
    // Si sigue activo, reiniciar automáticamente
    if (micActivo) {
      try { r.start(); } catch(e) {}
    } else {
      setEstado('idle');
      btnMic.classList.remove('on');
      btnMic.textContent = '🎙️';
    }
  };

  r.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript.trim().toLowerCase();
      if (e.results[i].isFinal) final += ' ' + e.results[i][0].transcript.trim();
      else interim += t;
    }

    // Mostrar transcripción en vivo
    const textoVivo = (interim || final).trim();
    liveText.textContent = textoVivo || '...';

    if (!final) return;
    const f = final.trim().toLowerCase();

    if (modoContinuo) {
      // ── MODO CONTINUO: detectar wake word ────────────────
      const tieneWake = WAKE_WORDS.some(w => f.includes(w));

      if (tieneWake && !esperandoCmd) {
        // Wake word detectado → activar modo comando
        esperandoCmd = true;
        bufferCmd    = '';
        setEstado('listening');
        hablar('Mande');
        liveText.textContent = '— escuchando tu comando —';
        statusLbl.textContent = 'Escuchando comando...';
        return;
      }

      if (esperandoCmd) {
        // Tenemos el comando
        bufferCmd = final.trim();
        esperandoCmd = false;
        if (bufferCmd.length > 2) enviar(bufferCmd);
        return;
      }
      // Si no hay wake word y no esperamos — ignorar (solo transcribir)

    } else {
      // ── MODO MANUAL: enviar todo lo que diga ─────────────
      if (final.trim().length > 2) {
        enviar(final.trim());
        if (!modoContinuo) toggleMic(); // apagar mic tras enviar en modo manual
      }
    }
  };

  r.onerror = (e) => {
    if (e.error === 'not-allowed') {
      liveText.textContent = '⚠️ Permiso de micrófono denegado — habilítalo en el navegador';
      micActivo = false;
      setEstado('idle');
    } else if (e.error !== 'no-speech') {
      console.log('SR error:', e.error);
    }
  };

  return r;
}

function toggleMic() {
  if (!recognition) recognition = initRecognition();
  if (!recognition) return;

  micActivo = !micActivo;
  esperandoCmd = false;
  bufferCmd = '';

  if (micActivo) {
    try { recognition.start(); } catch(e) {}
  } else {
    recognition.stop();
    setEstado('idle');
  }
}

// ══════════════════════════════════════════════════════════
// ENVÍO AL ASISTENTE
// ══════════════════════════════════════════════════════════
async function enviar(texto) {
  if (!texto || !texto.trim()) return;
  texto = texto.trim();

  setEstado('processing');
  statusLbl.textContent = 'Procesando...';
  liveText.textContent = '"' + texto + '"';
  mostrarRespuesta('...');

  try {
    const r = await fetch('/api/asistente/stream', {
      method:  'POST',
      headers: {'Content-Type':'application/json'},
      body:    JSON.stringify({ texto, session_id: sessionId }),
    });

    let respuesta = '';
    if (r.headers.get('content-type')?.includes('text/event-stream')) {
      // Streaming SSE
      const reader = r.body.getReader();
      const dec    = new TextDecoder();
      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        const chunk = dec.decode(value);
        const lines = chunk.split('\n');
        for (const line of lines) {
          if (line.startsWith('data: ')) {
            try {
              const d = JSON.parse(line.slice(6));
              if (d.texto) { respuesta += d.texto; mostrarRespuesta(respuesta); }
            } catch(e) {}
          }
        }
      }
    } else {
      const data = await r.json();
      respuesta = data.respuesta || data.mensaje || 'Sin respuesta';
      mostrarRespuesta(respuesta);
    }

    setEstado('speaking');
    hablar(respuesta);

    // Volver a escuchar después de hablar
    if (modoContinuo) {
      liveText.textContent = '— di "nexus" para continuar —';
    }

  } catch(e) {
    setEstado('idle');
    mostrarRespuesta('⚠️ Error de conexión — verifica que NEXUS esté corriendo');
  }
}

function enviarInput() {
  const inp = document.getElementById('cmdInput');
  if (inp.value.trim()) { enviar(inp.value); inp.value = ''; }
}

// ══════════════════════════════════════════════════════════
// TTS — Hablar respuesta
// ══════════════════════════════════════════════════════════
function getVoz() {
  if (vozCargada) return vozCargada;
  const vs = synth?.getVoices() || [];
  const pref = ['raúl','raul','diego','carlos','microsoft raul'];
  vozCargada =
    vs.find(v => v.lang==='es-MX' && pref.some(n => v.name.toLowerCase().includes(n)))
 || vs.find(v => v.lang==='es-MX')
 || vs.find(v => v.lang.startsWith('es'))
 || vs[0] || null;
  return vozCargada;
}
if (synth && 'onvoiceschanged' in synth) synth.onvoiceschanged = () => { vozCargada = null; };

function hablar(texto) {
  if (!synth) return;
  synth.cancel();
  const u  = new SpeechSynthesisUtterance(texto.slice(0, 400));
  u.lang   = 'es-MX';
  u.rate   = 0.92;
  u.pitch  = 1.05;
  const vz = getVoz();
  if (vz) u.voice = vz;
  u.onend = () => {
    if (micActivo) setEstado('listening');
    else setEstado('idle');
  };
  synth.speak(u);
}

// ══════════════════════════════════════════════════════════
// UI
// ══════════════════════════════════════════════════════════
function setEstado(s) {
  body.className = s;
  const labels = {
    idle:       'Toca para hablar',
    listening:  'Escuchando...',
    processing: 'Pensando...',
    speaking:   'Hablando...',
    error:      'Error',
  };
  const emojis = {
    idle:'🎙️', listening:'👂', processing:'🧠', speaking:'💬', error:'⚠️'
  };
  statusLbl.textContent = labels[s] || '';
  orb.textContent = emojis[s] || '🎙️';
}

function mostrarRespuesta(txt) {
  respTxt.textContent = txt;
  respBub.classList.add('show');
}

// ══════════════════════════════════════════════════════════
// INIT — Arrancar micrófono automáticamente en modo continuo
// ══════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  setEstado('idle');
  // Precargar voces
  if (synth) synth.getVoices();

  // Si modo continuo, arrancar mic automáticamente
  if (modoContinuo) {
    setTimeout(() => {
      toggleMic();
      liveText.textContent = '— di "nexus" para activar —';
    }, 800);
  }
});
</script>
</body>
</html>
